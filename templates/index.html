<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Document Studio — ATS &amp; Editor</title>
  <script src="https://cdn.jsdelivr.net/npm/tinymce@7.6.1/tinymce.min.js" referrerpolicy="origin"></script>
  <style>
    :root {
      --navy: #0f2c4c;
      --teal: #1a7a6d;
      --gold: #c48b2a;
      --paper: #e8e2d6;
      --ink: #1c2433;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Segoe UI", Calibri, Arial, sans-serif;
      background: var(--paper);
      color: var(--ink);
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--navy);
      color: #fff;
      padding: 0.7rem 1rem 0.55rem;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
    }
    header h1 { margin: 0; font-size: 1.15rem; font-weight: 600; }
    header p { margin: 0.15rem 0 0; font-size: 0.78rem; opacity: 0.8; }
    .chrome {
      background: #f7f4ee;
      border-bottom: 1px solid #d5cdc0;
      padding: 0.55rem 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem 0.7rem;
      align-items: end;
    }
    .chrome label { display: block; font-size: 0.7rem; font-weight: 700; color: #5c6b7a; margin-bottom: 0.15rem; }
    .chrome input, .chrome select, #jd, #kwFind {
      border: 1px solid #cfc4b2;
      padding: 0.38rem 0.5rem;
      font: inherit;
      background: #fff;
    }
    #url { min-width: 240px; width: 24vw; }
    #filename { min-width: 200px; }
    button {
      background: var(--teal);
      color: #fff;
      border: 0;
      padding: 0.45rem 0.8rem;
      font: inherit;
      font-size: 0.85rem;
      font-weight: 650;
      cursor: pointer;
      height: 34px;
    }
    button.navy { background: var(--navy); }
    button.ghost { background: #fff; color: var(--navy); border: 1px solid #cfc4b2; }
    button.gold { background: var(--gold); color: #1c2433; }
    .workspace { flex: 1; display: grid; grid-template-columns: 340px 1fr; min-height: 0; }
    .jd-panel {
      background: #fff;
      border-right: 1px solid #d5cdc0;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .jd-panel h2 { margin: 0; font-size: 0.85rem; padding: 0.7rem 0.8rem 0.3rem; }
    #jd { width: 100%; flex: 0 0 180px; resize: vertical; min-height: 140px; border-left: 0; border-right: 0; }
    .scorebox { padding: 0.6rem 0.8rem; overflow: auto; flex: 1; }
    .score-num { font-size: 2rem; font-weight: 700; color: var(--navy); }
    .bar { height: 6px; background: #eee; margin: 0.2rem 0 0.5rem; }
    .bar > span { display: block; height: 100%; background: var(--teal); }
    .chip { display: inline-block; margin: 0 0.25rem 0.25rem 0; padding: 0.15rem 0.4rem; font-size: 0.72rem; border-radius: 3px; }
    .chip.ok { background: #d8efe4; }
    .chip.miss { background: #f8d7d7; }
    .filters { display: flex; flex-wrap: wrap; gap: 0.25rem; margin: 0.4rem 0; }
    .filters button { height: 26px; font-size: 0.72rem; padding: 0 0.45rem; }
    .stage { padding: 0.5rem 0.8rem 0.8rem; min-height: 0; overflow: auto; }
    .page { background: #fff; box-shadow: 0 8px 28px rgba(15, 44, 76, 0.12); }
    #status { font-size: 0.78rem; padding: 0.25rem 1rem 0.4rem; color: #5c6b7a; }
    #status.err { color: #9b2c2c; }
    #status.ok { color: #2f6b4f; }
    .tox-tinymce { border: 0 !important; }
    .findings li { font-size: 0.8rem; margin: 0.2rem 0; }
    @media (max-width: 980px) {
      .workspace { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Document Studio + ATS</h1>
      <p>Paste a JD, score like an ATS, filter keywords, format an ATS resume, export PDF/Word.</p>
    </div>
    <div>
      <button type="button" class="ghost" id="btnNew">New</button>
      <button type="button" class="ghost" id="btnSample">Load application</button>
      <button type="button" class="gold" id="btnFormat">Format ATS resume</button>
    </div>
  </header>

  <div class="chrome">
    <div>
      <label for="url">Import from web</label>
      <input id="url" type="url" placeholder="https://job-posting.example/..." />
    </div>
    <button type="button" class="navy" id="btnFetch">Get page</button>
    <button type="button" class="ghost" id="btnFetchJd">URL → JD</button>
    <div>
      <label for="filename">File name</label>
      <input id="filename" type="text" value="ATS_Resume" />
    </div>
    <div>
      <label for="paper">Page</label>
      <select id="paper">
        <option value="A4">A4</option>
        <option value="LETTER">Letter</option>
      </select>
    </div>
    <button type="button" id="btnPdf">Download PDF</button>
    <button type="button" class="navy" id="btnDocx">Download Word</button>
    <button type="button" class="gold" id="btnScore">Run ATS score</button>
  </div>
  <div id="status">Paste the job description on the left, then Run ATS score.</div>

  <div class="workspace">
    <aside class="jd-panel">
      <h2>Job description</h2>
      <textarea id="jd" placeholder="Paste the JD here, or use URL → JD after fetching a posting."></textarea>
      <div class="scorebox">
        <div class="score-num" id="overall">—</div>
        <div id="band" style="font-size:0.8rem;margin-bottom:0.6rem;">No score yet</div>
        <div id="bars"></div>
        <label for="kwFind" style="font-size:0.7rem;font-weight:700;">Keyword finder</label>
        <input id="kwFind" type="search" placeholder="Filter keywords…" style="width:100%;margin:0.25rem 0 0.4rem;" />
        <div class="filters" id="filterBtns"></div>
        <div id="chips"></div>
        <ul class="findings" id="findings"></ul>
      </div>
    </aside>
    <div class="stage">
      <div class="page">
        <textarea id="editor">{{ sample_html|safe }}</textarea>
      </div>
    </div>
  </div>

  <script>
    const SAMPLE_HTML = {{ sample_html|tojson }};
    const statusEl = document.getElementById("status");
    let lastAts = null;
    let activeFilter = "all";

    const DEFAULT_JD = `Head of IT & Change Leader — IFS Australia & New Zealand IT
Securities Services Department – CIB (IFS Australia & New Zealand)

We are seeking an IT & Change Leader to own regional IT delivery and change for IFS Australia and New Zealand. The role requires:

- End-to-end program and change management across a matrixed global organisation
- Stakeholder alignment with APAC and global business sponsors; steering committees and KPI / SLA governance
- Legacy platform modernisation, cloud-native operations, DevOps and CI/CD
- Leadership of large engineering organisations, vendor management, and budget ownership
- Agile / Scrum delivery, Jira, Power BI reporting, ITIL, risk and issue management
- Experience as a liaison between Global IT, regional units, and third-party partners
`;

    function setStatus(msg, kind) {
      statusEl.textContent = msg;
      statusEl.className = kind || "";
    }

    tinymce.init({
      selector: "#editor",
      license_key: "gpl",
      base_url: "https://cdn.jsdelivr.net/npm/tinymce@7.6.1",
      suffix: ".min",
      height: "calc(100vh - 210px)",
      menubar: "file edit view insert format tools table help",
      plugins:
        "preview importcss searchreplace autolink autosave save directionality code visualblocks visualchars fullscreen image link media codesample table charmap pagebreak nonbreaking anchor insertdatetime advlist lists wordcount help charmap quickbars accordion",
      toolbar_mode: "sliding",
      toolbar: [
        "undo redo | cut copy paste pastetext | searchreplace | selectall | visualblocks visualchars | fullscreen preview print | code",
        "blocks fontfamily fontsize lineheight | bold italic underline strikethrough | forecolor backcolor | removeformat",
        "alignleft aligncenter alignright alignjustify | bullist numlist outdent indent | blockquote subscript superscript | ltr rtl",
        "link unlink openlink | image media table | hr pagebreak charmap insertdatetime | accordion"
      ].join(" | "),
      font_family_formats:
        "Calibri=calibri,sans-serif; Arial=arial,helvetica,sans-serif; Times New Roman=times new roman,times,serif; Georgia=georgia,serif; Verdana=verdana,geneva,sans-serif",
      font_size_formats: "8pt 9pt 10pt 11pt 12pt 14pt 16pt 18pt 24pt 36pt",
      line_height_formats: "1 1.15 1.5 1.75 2",
      browser_spellcheck: true,
      content_style:
        "body { font-family: Calibri, Arial, sans-serif; font-size: 11pt; color: #1c2433; max-width: 760px; margin: 18px auto; }",
      promotion: false,
      branding: false,
      setup: (editor) => {
        editor.on("change keyup", () => {
          const n = editor.plugins.wordcount ? editor.plugins.wordcount.getCount() : 0;
          setStatus(n + " words in resume/application");
        });
      }
    });

    document.getElementById("jd").value = DEFAULT_JD;

    document.getElementById("btnNew").onclick = () => tinymce.get("editor").setContent("<p></p>");
    document.getElementById("btnSample").onclick = () => {
      tinymce.get("editor").setContent(SAMPLE_HTML);
      setStatus("Application letter and CV loaded.", "ok");
    };

    async function fetchPage(intoJd) {
      const url = document.getElementById("url").value.trim();
      if (!url) { setStatus("Enter a web URL first.", "err"); return; }
      setStatus("Fetching page…");
      const res = await fetch("/fetch-url", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url })
      });
      const data = await res.json();
      if (!data.ok) { setStatus(data.error || "Fetch failed", "err"); return; }
      const tmp = document.createElement("div");
      tmp.innerHTML = data.html;
      const text = tmp.innerText;
      if (intoJd) {
        document.getElementById("jd").value = text;
        setStatus("Job posting loaded into JD panel.", "ok");
      } else {
        tinymce.get("editor").setContent(data.html);
        setStatus("Page imported into the editor.", "ok");
      }
    }
    document.getElementById("btnFetch").onclick = () => fetchPage(false);
    document.getElementById("btnFetchJd").onclick = () => fetchPage(true);

    function renderAts(data) {
      lastAts = data;
      document.getElementById("overall").textContent = data.overall + " / 100";
      document.getElementById("band").textContent = data.band + " · " + data.word_count + " words";
      const bars = document.getElementById("bars");
      bars.innerHTML = "";
      Object.entries(data.parts).forEach(([k, v]) => {
        bars.innerHTML += `<div style="font-size:0.72rem">${k.replaceAll("_", " ")} ${v}</div><div class="bar"><span style="width:${v}%"></span></div>`;
      });
      const wrap = document.getElementById("filterBtns");
      wrap.innerHTML = "";
      data.filters.forEach((f) => {
        const b = document.createElement("button");
        b.className = f === activeFilter ? "navy" : "ghost";
        b.textContent = f;
        b.onclick = () => { activeFilter = f; renderChips(); };
        wrap.appendChild(b);
      });
      document.getElementById("findings").innerHTML = (data.findings || []).map((x) => `<li>${x}</li>`).join("");
      renderChips();
    }

    function renderChips() {
      if (!lastAts) return;
      const q = document.getElementById("kwFind").value.trim().toLowerCase();
      let rows = [...lastAts.matched, ...lastAts.missing];
      if (activeFilter === "matched") rows = lastAts.matched;
      if (activeFilter === "missing") rows = lastAts.missing;
      if (["skills", "tools", "certs", "titles", "keywords"].includes(activeFilter)) {
        rows = rows.filter((r) => r.category === activeFilter);
      }
      if (q) rows = rows.filter((r) => r.term.includes(q));
      document.getElementById("chips").innerHTML = rows.map((r) =>
        `<span class="chip ${r.matched ? "ok" : "miss"}">${r.term}</span>`
      ).join("");
    }
    document.getElementById("kwFind").addEventListener("input", renderChips);

    document.getElementById("btnScore").onclick = async () => {
      const editor = tinymce.get("editor");
      const res = await fetch("/ats-score", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          html: editor.getContent(),
          text: editor.getContent({ format: "text" }),
          jd: document.getElementById("jd").value
        })
      });
      const data = await res.json();
      if (!data.ok) { setStatus(data.error, "err"); return; }
      renderAts(data);
      setStatus("ATS score " + data.overall + " — green chips are in the resume, red are missing from the JD.", "ok");
    };

    document.getElementById("btnFormat").onclick = async () => {
      const editor = tinymce.get("editor");
      const res = await fetch("/format-resume", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: editor.getContent({ format: "text" }), html: editor.getContent() })
      });
      const data = await res.json();
      if (!data.ok) { setStatus(data.error, "err"); return; }
      editor.setContent(data.html);
      document.getElementById("filename").value = "ATS_Resume";
      setStatus("ATS-formatted resume loaded (linear headings, no tables). Export PDF or Word.", "ok");
    };

    async function exportDoc(format) {
      const editor = tinymce.get("editor");
      const html = editor.getContent();
      const text = editor.getContent({ format: "text" });
      if (!text.trim()) { setStatus("Document is empty.", "err"); return; }
      const body = new FormData();
      body.set("format", format);
      body.set("html", html);
      body.set("text", text);
      body.set("filename", document.getElementById("filename").value);
      body.set("paper", document.getElementById("paper").value);
      setStatus("Building " + format.toUpperCase() + "…");
      const res = await fetch("/export", { method: "POST", body });
      if (!res.ok) {
        let msg = "Export failed";
        try { msg = (await res.json()).error || msg; } catch (e) {}
        setStatus(msg, "err");
        return;
      }
      const blob = await res.blob();
      const a = document.createElement("a");
      const ext = format === "docx" ? ".docx" : ".pdf";
      a.href = URL.createObjectURL(blob);
      a.download = (document.getElementById("filename").value || "document") + ext;
      a.click();
      URL.revokeObjectURL(a.href);
      setStatus("Downloaded " + a.download, "ok");
    }
    document.getElementById("btnPdf").onclick = () => exportDoc("pdf");
    document.getElementById("btnDocx").onclick = () => exportDoc("docx");
  </script>
</body>
</html>
